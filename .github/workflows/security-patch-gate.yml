name: security-patch-gate

# Security Shield: decides whether a dependency PR (from Dependabot, or a Devin branch named
# devin/security-shield-*) is a same-major bump that Devin may merge once CI is green.
# A red result is not an error — it means the PR needs owner review.
# The gate script is always taken from the base branch so a PR cannot loosen its own gate.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: security-patch-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-patch-gate:
    if: github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref, 'devin/security-shield-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run gate from base branch
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:.github/scripts/security-patch-gate.mjs" > "$RUNNER_TEMP/gate.mjs"
          node "$RUNNER_TEMP/gate.mjs" "$BASE"
